<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>가니를 맞춰봐</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 깊은 바닷물 배경 위로 새우가 둥둥. 카드 한 장에 문제 하나, 고르면 바로 결과. 모바일 우선, PC는 가운데 정렬 */
:root {
  color-scheme: dark;
  --bg: #0a2c37;
  --card: #0f3a48;
  --fg: #f3f8f7;
  --muted: #a9c4c8;
  --line: #2f6070;
  --accent: #ff8f66;
  --accent-fg: #2a0f06;
  --good: #7be0a6; --good-soft: #134a35;
  --bad: #ff9a90; --bad-soft: #5a2523;
  --font-display: "Black Han Sans", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(180deg, #0f4352 0%, #082530 100%);
  background-attachment: fixed;
  color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.sea { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.shr { position: absolute; left: var(--x); top: var(--y); opacity: var(--o); filter: blur(var(--b));
  animation: bob var(--t) ease-in-out var(--dl) infinite alternate; }
.shr svg { display: block; width: var(--w); height: auto; transform: scaleX(var(--f)); }
@keyframes bob {
  0%   { transform: translate(0, 0) rotate(calc(var(--r) - 7deg)); }
  100% { transform: translate(var(--dx), -34px) rotate(calc(var(--r) + 7deg)); }
}
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }
.card {
  background: var(--card);
  background: color-mix(in srgb, var(--card) 84%, transparent);
  border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; min-width: 0;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.provisional { font-size: 13px; color: var(--accent-fg); background: var(--accent); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; font-weight: 700; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 12px; margin-bottom: 14px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.4; text-wrap: balance; margin: 0; }
p { margin: 0; }
.options { display: grid; gap: 10px; margin: 24px 0 0; padding: 0; list-style: none; }
.opt { font: inherit; text-align: left; cursor: pointer; width: 100%; background: var(--card); color: var(--fg);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border: 2px solid var(--good); background: var(--good-soft); }
.opt.wrong { border: 2px solid var(--bad); background: var(--bad-soft); }
.opt .mark { font-size: 13px; font-weight: 700; white-space: nowrap; align-self: center; }
.opt.right .mark { color: var(--good); } .opt.wrong .mark { color: var(--bad); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.verdict { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
.verdict .label { font-size: 14px; font-weight: 700; }
.verdict.good .label { color: var(--good); } .verdict.bad .label { color: var(--bad); }
.verdict .big { font-family: var(--font-display); font-size: 28px; line-height: 1.35; margin-top: 4px; text-wrap: balance; }
.verdict .after { margin-top: 12px; color: var(--muted); }
.fade { animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .shr { animation: none; } }
@media (min-width: 640px) { .card { padding: 40px 36px; } h1 { font-size: 30px; } body { padding-block: 64px; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs id="defs"></defs></svg>
<div class="sea" id="sea" aria-hidden="true"></div>

<div class="wrap">
  <p class="provisional" id="prov" hidden>정답 확인 전이라 임시로 ①번을 정답으로 해 두었어요. 정답이 정해지면 바뀝니다.</p>
  <main class="card" id="card"></main>
</div>

<script>
/* ===== 여기만 바꾸면 됩니다 ===== */
var CONFIG = {
  title: "가니를 맞춰봐",
  question: "가니가 어제 먹다 남긴 크림칠리새우의 개수는?",
  options: ["3개", "2개", "1개", "다 먹었다"],
  answer: 1,                       // 정답 번호 (0부터 시작: ①=0, ②=1, ③=2, ④=3)
  provisional: false,               // 정답 확인 전 임시 표시. 확정되면 false
  rightMsg: "가니 집에 cctv 달아놨어요?",
  wrongMsg: "실망이야 흥!",
  afterMsg: "너는 가니에 대해 얼마나 알까?"
};
/* ===== 여기까지 ===== */

/* ---- 새우 그리기 (SVG, 한 번 정의해서 여러 마리로 재사용) ---- */
(function buildShrimp() {
  var cx = 60, cy = 62, R = 38, rad = Math.PI / 180;
  function P(th, r) { r = r || R; return [cx + r * Math.cos(th * rad), cy + r * Math.sin(th * rad)]; }
  function f(n) { return n.toFixed(1); }
  var s = '' +
    '<linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffc9a3"/><stop offset=".4" stop-color="#ff8f62"/><stop offset="1" stop-color="#d4452a"/></linearGradient>' +
    '<linearGradient id="gTail" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#ff9c70"/><stop offset="1" stop-color="#c2361d"/></linearGradient>' +
    '<g id="shrimp">';
  // 더듬이
  s += '<path d="M18 42 Q2 20 -15 27" fill="none" stroke="#ff9d72" stroke-width="1.1" stroke-linecap="round"/>' +
       '<path d="M20 47 Q-2 40 -17 52" fill="none" stroke="#ff9d72" stroke-width="1.1" stroke-linecap="round"/>';
  // 다리
  for (var i = 1; i <= 6; i++) {
    var t = i / 9, th = 218 + t * 120, p = P(th), dx = (cx - p[0]) / R, dy = (cy - p[1]) / R;
    var x1 = p[0] + dx * 6, y1 = p[1] + dy * 6, x2 = x1 + dx * 9 - dy * 3, y2 = y1 + dy * 9 + dx * 3;
    s += '<path d="M' + f(x1) + ' ' + f(y1) + ' L' + f(x2) + ' ' + f(y2) + '" stroke="#e1643a" stroke-width="1.4" stroke-linecap="round"/>';
  }
  // 꼬리 부채
  var tp = P(344);
  [-32, 0, 32].forEach(function (a) {
    s += '<g transform="translate(' + f(tp[0]) + ' ' + f(tp[1]) + ') rotate(' + (344 + 90 + a) + ')">' +
         '<ellipse cx="9" cy="0" rx="9.5" ry="4.2" fill="url(#gTail)" stroke="#9c2b16" stroke-width=".7"/></g>';
  });
  // 몸통 마디 (꼬리 쪽부터 그려서 머리 쪽이 위에 겹침)
  for (var k = 7; k >= 0; k--) {
    var tt = k / 7, th2 = 212 + tt * 132, q = P(th2), ry = 10 - tt * 5, rx = 8.4 - tt * 1.6;
    s += '<ellipse cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" rx="' + f(rx) + '" ry="' + f(ry) +
         '" transform="rotate(' + f(th2 + 90) + ' ' + f(q[0]) + ' ' + f(q[1]) + ')" fill="url(#gBody)" stroke="#a52e17" stroke-width=".8"/>';
  }
  // 등 광택
  var g1 = P(228, R + 5), g2 = P(332, R + 5);
  s += '<path d="M' + f(g1[0]) + ' ' + f(g1[1]) + ' A' + (R + 5) + ' ' + (R + 5) + ' 0 0 1 ' + f(g2[0]) + ' ' + f(g2[1]) +
       '" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2.2" stroke-linecap="round"/>';
  // 머리(갑각) + 뿔 + 눈
  s += '<path d="M17 40 L3 31 L19 46 Z" fill="#e8573a" stroke="#a52e17" stroke-width=".7" stroke-linejoin="round"/>' +
       '<ellipse cx="27" cy="46" rx="12.5" ry="10.5" transform="rotate(-28 27 46)" fill="url(#gBody)" stroke="#a52e17" stroke-width=".9"/>' +
       '<circle cx="20.5" cy="42" r="2.6" fill="#1b0e09"/><circle cx="19.7" cy="41.2" r=".9" fill="#fff"/>';
  s += '</g>';
  document.getElementById("defs").innerHTML = s;
})();

/* ---- 둥둥 떠다니는 새우 ---- */
(function floatShrimp() {
  var sea = document.getElementById("sea"), n = window.innerWidth < 640 ? 16 : 26, html = "";
  for (var i = 0; i < n; i++) {
    var far = Math.random() < 0.4, w = far ? 46 + Math.random() * 30 : 84 + Math.random() * 60;
    html += '<div class="shr" style="' +
      '--x:' + (Math.random() * 94 - 4).toFixed(1) + '%;--y:' + (Math.random() * 92 - 4).toFixed(1) + '%;' +
      '--w:' + w.toFixed(0) + 'px;--o:' + (far ? 0.55 : 0.95) + ';--b:' + (far ? '1.5px' : '0px') + ';' +
      '--f:' + (Math.random() < 0.5 ? 1 : -1) + ';--r:' + (Math.random() * 60 - 30).toFixed(0) + 'deg;' +
      '--dx:' + (Math.random() * 40 - 20).toFixed(0) + 'px;' +
      '--t:' + (5 + Math.random() * 5).toFixed(1) + 's;--dl:-' + (Math.random() * 8).toFixed(1) + 's">' +
      '<svg viewBox="-18 10 138 66"><use href="#shrimp"/></svg></div>';
  }
  sea.innerHTML = html;
})();

/* ---- 퀴즈 ---- */
var card = document.getElementById("card"), MARKS = ["①", "②", "③", "④", "⑤"];
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
if (CONFIG.provisional) document.getElementById("prov").hidden = false;
document.title = CONFIG.title;

var html = '<span class="tag">' + esc(CONFIG.title) + '</span><h1>' + esc(CONFIG.question) + '</h1><ul class="options">';
CONFIG.options.forEach(function (t, i) {
  html += '<li><button class="opt" type="button" data-i="' + i + '"><span>' + MARKS[i] + ' ' + esc(t) + '</span><span class="mark"></span></button></li>';
});
html += '</ul><div id="after"></div>';
card.innerHTML = html;

card.querySelectorAll(".opt").forEach(function (b) {
  b.onclick = function () {
    var pick = +b.getAttribute("data-i"), ok = pick === CONFIG.answer;
    card.querySelectorAll(".opt").forEach(function (x, k) {
      x.disabled = true;
      if (k === CONFIG.answer) { x.classList.add("right"); x.querySelector(".mark").textContent = "정답"; }
      else if (k === pick) { x.classList.add("wrong"); x.querySelector(".mark").textContent = "오답"; }
    });
    var after = document.getElementById("after");
    after.innerHTML = '<div class="verdict fade ' + (ok ? 'good' : 'bad') + '">' +
      '<p class="label">' + (ok ? '정답!' : '오답') + '</p>' +
      '<p class="big">' + esc(ok ? CONFIG.rightMsg : CONFIG.wrongMsg) + '</p>' +
      '<p class="after">' + esc(CONFIG.afterMsg) + '</p></div>';
  };
});
</script>

</html>
