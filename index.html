<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>우정 파탄 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 폰 폭(최대 520px) 한 칼럼. 위에 우정도 게이지가 붙어 있고, 아래로 대화가 쌓이는 단톡방 구조 */
:root{
  --bg:#eceefa; --panel:#ffffff; --ink:#1c1d2e; --muted:#666a85; --line:#d6d9ee;
  --narr:#e0e3f6; --accent:#ff4f86; --accent-ink:#ffffff; --good:#17895c; --bad:#d23a47;
  --c0:#ff8fb3; --c1:#62b4ff; --c2:#ffbd45; --c3:#4fd1a0;
  --font-display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11121c; --panel:#1b1d2c; --ink:#ecedfb; --muted:#9a9db8; --line:#2c2f46;
    --narr:#242741; --accent:#ff6f9d; --accent-ink:#2a0615; --good:#4cd29a; --bad:#ff6b76;
    --c0:#ff7aa6; --c1:#59a8f5; --c2:#f2b03a; --c3:#43c394; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11121c; --panel:#1b1d2c; --ink:#ecedfb; --muted:#9a9db8; --line:#2c2f46;
  --narr:#242741; --accent:#ff6f9d; --accent-ink:#2a0615; --good:#4cd29a; --bad:#ff6b76;
  --c0:#ff7aa6; --c1:#59a8f5; --c2:#f2b03a; --c3:#43c394; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 40px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:20}
.app{max-width:520px; margin:0 auto; min-width:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2{font-family:var(--font-display); font-weight:400; text-wrap:balance; margin:0}

/* 타이틀 화면 */
.title{padding:28px 0 8px; text-align:center}
.title .room{display:inline-block; font-size:.85rem; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 14px}
.title h1{font-size:clamp(2.2rem,9vw,3rem); line-height:1.15; margin-top:18px}
.title h1 em{font-style:normal; color:var(--accent)}
.title p{color:var(--muted); margin:14px auto 0; max-width:34ch}
.pick-q{font-family:var(--font-display); font-size:1.35rem; text-align:center; margin:30px 0 14px}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pick{
  background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:14px 10px; text-align:center;
  display:flex; flex-direction:column; gap:2px; align-items:center; min-width:0;
  transition:transform .12s ease, border-color .12s ease;
}
.pick:hover{transform:translateY(-2px)}
.pick .em{font-size:2.2rem; line-height:1.2}
.pick .nm{font-weight:700}
.pick .tg{font-size:.8rem; color:var(--muted)}
.pick[data-i="0"]:hover{border-color:var(--c0)} .pick[data-i="1"]:hover{border-color:var(--c1)}
.pick[data-i="2"]:hover{border-color:var(--c2)} .pick[data-i="3"]:hover{border-color:var(--c3)}
.how{margin-top:22px; font-size:.85rem; color:var(--muted); text-align:center}

/* 우정도 게이지 */
.gauges{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--panel);
  border:1px solid var(--line); border-radius:16px; padding:10px 12px; display:grid; gap:7px; margin-bottom:14px;
}
.g-row{display:grid; grid-template-columns:auto 3.2em 1fr 2.2em; align-items:center; gap:8px; font-size:.85rem}
.g-row .nm{font-weight:700; white-space:nowrap}
.bar{height:10px; border-radius:99px; background:var(--narr); overflow:hidden}
.bar i{display:block; height:100%; width:50%; border-radius:99px; transition:width .5s ease}
.g-row .val{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
.g-row.flash-up .val{color:var(--good)} .g-row.flash-down .val{color:var(--bad)}
.low .val{color:var(--bad)}

/* 장면 */
.scene-head{display:flex; align-items:center; gap:10px; margin:6px 2px 12px}
.scene-head .bg{font-size:1.6rem}
.scene-head h2{font-size:1.3rem}
.scene-head .place{font-size:.8rem; color:var(--muted)}
.watch{margin-left:auto; font-size:.75rem; border:1px dashed var(--muted); color:var(--muted); border-radius:99px; padding:2px 10px; white-space:nowrap}
.feed{display:grid; gap:10px}
.narr{background:var(--narr); border-radius:12px; padding:10px 14px; font-size:.92rem; color:var(--muted); text-align:center}
.msg{display:flex; gap:8px; align-items:flex-start; max-width:92%}
.avatar{flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:1.3rem; background:var(--panel); border:2px solid var(--line)}
.who{font-size:.75rem; color:var(--muted); margin:0 0 2px 2px}
.bubble{padding:9px 13px; border-radius:4px 16px 16px 16px; border:1px solid var(--line); overflow-wrap:anywhere; word-break:keep-all}
.msg[data-c="0"] .bubble{background:color-mix(in srgb, var(--c0) 20%, var(--panel))} .msg[data-c="0"] .avatar{border-color:var(--c0)}
.msg[data-c="1"] .bubble{background:color-mix(in srgb, var(--c1) 20%, var(--panel))} .msg[data-c="1"] .avatar{border-color:var(--c1)}
.msg[data-c="2"] .bubble{background:color-mix(in srgb, var(--c2) 22%, var(--panel))} .msg[data-c="2"] .avatar{border-color:var(--c2)}
.msg[data-c="3"] .bubble{background:color-mix(in srgb, var(--c3) 22%, var(--panel))} .msg[data-c="3"] .avatar{border-color:var(--c3)}
.msg > div{min-width:0}

.choices{display:grid; gap:9px; margin-top:16px}
.choice{
  text-align:left; background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start; transition:border-color .12s ease, transform .12s ease, opacity .2s ease;
}
.choice:hover:not(:disabled){border-color:var(--accent); transform:translateY(-1px)}
.choice .no{flex:none; font-family:var(--font-display); color:var(--accent); font-size:1.1rem; line-height:1.4}
.choice .tx{min-width:0; overflow-wrap:anywhere}
.choice .flag{display:inline-block; margin-left:6px; font-size:.72rem; background:var(--accent); color:var(--accent-ink); border-radius:99px; padding:0 8px; vertical-align:middle}
.choice.picked{border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.38}

.after{display:grid; gap:10px; margin-top:12px}
.chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.chip{font-size:.8rem; font-weight:700; border-radius:99px; padding:2px 10px; border:1px solid var(--line); background:var(--panel); font-variant-numeric:tabular-nums}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)} .chip.zero{color:var(--muted); font-weight:500}
.btn{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:14px; padding:13px 18px; font-weight:700; width:100%;
}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.progress{display:flex; gap:6px; justify-content:center; margin:14px 0 0}
.progress i{width:26px; height:5px; border-radius:99px; background:var(--line)}
.progress i.on{background:var(--accent)}

/* 엔딩 */
.end-card{text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:24px 16px; margin:8px 0 16px}
.end-card .big{font-size:3rem; line-height:1.1}
.end-card .lab{font-size:.8rem; color:var(--muted); margin-top:8px}
.end-card h2{font-size:2rem; margin-top:4px}
.sys{text-align:center; font-size:.85rem; color:var(--muted); background:var(--narr); border-radius:99px; padding:5px 14px; justify-self:center; overflow-wrap:anywhere}
.note{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; font-size:.92rem; overflow-wrap:anywhere}
.note small{display:block; color:var(--muted); font-size:.75rem; margin-bottom:2px}
.final-g{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px; display:grid; gap:7px; margin:16px 0}
.final-g h3{margin:0 0 2px; font-size:.85rem; color:var(--muted); font-weight:500}
.copied{font-size:.85rem; color:var(--muted); text-align:center; min-height:1.3em}

@media (prefers-reduced-motion: no-preference){
  .reveal{animation:up .45s ease both}
  @keyframes up{from{opacity:0; transform:translateY(8px)}}
}
@media (max-width:380px){
  .g-row{grid-template-columns:auto 2.8em 1fr 2em; gap:6px; font-size:.8rem}
}
</style>

<div class="app" id="app"></div>

<script>
(function(){
  var CH = [
    {n:'김가은', s:'가은', e:'👸', tag:'공주'},
    {n:'남채영', s:'채영', e:'📸', tag:'인스타 감성'},
    {n:'이서아', s:'서아', e:'🍺', tag:'술 먹으면 무단횡단'},
    {n:'정다희', s:'다희', e:'🥺', tag:'거절을 못 함'}
  ];

  // 장면 데이터. d = [가은, 채영, 서아, 다희] 우정도 변화
  var SCENES = [
    {
      id:1, main:1, bg:'☕', place:'감성 카페', title:'인생샷',
      narr:'감성 카페에 도착했다. 채영이 말없이 폰을 건넨다.',
      watch:'채영이 가은에게 폰을 건넨다. "가로로. 내 감성 알잖아." 가은이 벌써 30장째 찍고 있다.',
      lines:function(p){
        var a=[{w:1,t:'나 사진 한 장만 찍어줘. 아, 가로로. 내 감성 알잖아. 잘 부탁해~'}];
        if(p!==0) a.push({w:0,t:'나도 같이 찍어줘. 가니두 나와야지. >.<!!'});
        return a;
      },
      choices:[
        {t:'쪼그려 앉아 30장 찍고 보정까지 해준다', flag:'d1', r:{w:1,t:'...오. 이거다. 게시물 감인데?'}, d:[-1,2,0,1]},
        {t:'"그냥 대충 두 장만 찍을게"', r:{w:1,t:'(표정이 굳는다) ...난 너 열심히 찍어줬는데'}, d:[0,-2,1,0]},
        {t:'"너만 찍지 말고 같이 셀카 찍자"', r:{w:1,t:'...구도가 좀 아쉬운데, 뭐 이것도 나쁘진 않네.'}, d:[2,-1,0,1]}
      ]
    },
    {
      id:2, main:2, bg:'🌙', place:'밤, 4차선 도로 앞', title:'새벽 횡단보도',
      narr:'2차가 끝난 새벽. 서아가 횡단보도 앞에서 신호도 안 보고 한 발 내딛는다.',
      watch:'서아가 횡단보도에서 한 발 내딛는다. 누군가 서아의 팔을 붙잡았다.',
      lines:function(){ return [{w:2,t:'나 저기 편의점 갈 거야... 4차선 도로 무단횡단할 거야! 낄낄낄!'}]; },
      choices:[
        {t:'팔을 붙잡고 "신호 바뀔 때까지 같이 기다리자"', r:{w:2,t:'...너 진짜 내 친구야ㅠㅠ (울면서 안긴다)'}, d:[0,0,2,1]},
        {t:'택시를 불러 억지로 태운다', r:{w:2,t:'버리는 거야?? 나 버리는 거지??'}, d:[1,1,-1,-1]},
        {t:'영상 찍으며 "내일 보여줄게" 하고 놀린다', r:{w:2,t:'야 지워!!! 지워라 진짜!! (눈물이 쏙 들어간다)'}, d:[0,1,-2,-1]}
      ]
    },
    {
      id:3, main:3, bg:'📱', place:'폰 화면', title:'부탁 폭탄',
      narr:'정다희의 폰이 쉴 새 없이 울린다. 전부 부탁 메시지다.',
      watch:'다희의 폰이 쉴 새 없이 울린다. 다희는 "응... 알겠어..."만 열 번째 치고 있다.',
      lines:function(){ return [{w:3,t:'아... 이번 주말에 이사 도와달래... 나 약속 있는데... 근데 거절하면 서운해할 것 같고... 어떡하지...'}]; },
      choices:[
        {t:'"내가 대신 \'다희 주말 바빠요^^\' 하고 말해줄게"', r:{w:3,t:'...고마워ㅠㅠ 근데 서운해하면 어떡해'}, d:[0,-1,1,2]},
        {t:'"그냥 해줘, 착한 일이잖아"', r:{w:3,t:'...그래... 해야지... (눈을 질끈 감는다)'}, d:[-1,1,-2,-2]},
        {t:'"내가 대신 이사 갈게"', flag:'d3', r:{w:3,t:'진짜?! ...근데 너 이삿짐 잘 들어?'}, d:[1,1,1,2]}
      ]
    },
    {
      id:4, main:0, bg:'🍽️', place:'식당 입구', title:'공주 입장',
      narr:'약속 시간 1시간 뒤, 김가은이 나타났다.',
      watch:'약속 시간 1시간 뒤, 가은이 식당 문을 열고 들어온다. "주인공은 원래 늦게 등장하는 거 알지...?" 친구들이 박수를 친다.',
      lines:function(){ return [{w:0,t:'나 왔어~ 주인공은 원래 늦게 등장하는 거 알지...? >.<'}]; },
      choices:[
        {t:'박수 치며 "공주님 납셨네요~" 하고 맞이한다', r:{w:0,t:'고마워~ 역시 너는 예의가 있어.'}, d:[2,-1,-1,1]},
        {t:'"1시간 늦었어. 사과부터 해"', r:{w:0,t:'...뭐? 나한테 사과하라고?'}, d:[-2,1,1,-1]},
        {t:'가방을 받아 들고 의자까지 빼준다', r:{w:0,t:'오늘 서비스 좋은데? 팁이다~'}, d:[2,0,-1,-1]}
      ]
    },
    {
      id:5, main:-1, bg:'💬', place:'단톡방', title:'연말 모임 장소 투표',
      narr:'연말 모임 장소를 정해야 한다.',
      lines:function(p){
        var all=[
          {w:0,t:'겨울은 추우니까 걸어서 5분 이내 아니면 안 감. 택시도 싫어.'},
          {w:1,t:'나는 사진 잘 나오는 감성 루프탑! 조명 중요해.'},
          {w:2,t:'술. 술집. 2차 3차 가능한 곳.'},
          {w:3,t:'나는 다 좋아~ 너네 가고 싶은 데로 가자.'}
        ];
        return all.filter(function(x){return x.w!==p;});
      },
      choices:[
        {t:'감성 루프탑에 한 표', spk:1, r:{w:1,t:'역시 센스 있어. 조명 체크는 내가 한다.'}, rp:'단톡방에 루프탑 예약 링크가 올라왔다.', d:[-1,2,-1,1]},
        {t:'술집에 한 표', spk:2, r:{w:2,t:'ㅇㅋ 오늘은 안 울게... 아마도.'}, rp:'단톡방에 술집 예약 캡처가 올라왔다.', d:[0,-1,2,-1]},
        {t:'"다희가 정해줘" 하고 맡긴다', spk:3, tp:'다 좋다니까 아무나 정해줘', r:{w:3,t:'어? 나...? 음... 다 같이 갈 수 있는 곳으로...?'},
          rr:{w:0,t:'...그럼 걸어서 5분 이내로 하자.'}, rp:'단톡방에 "..." 한 글자만 올라왔다.', d:[1,0,1,-2]}
      ]
    }
  ];

  var app = document.getElementById('app');
  var S = null; // 게임 상태

  function h(tag, cls, text){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(text!==undefined) e.textContent=text;
    return e;
  }
  function clamp(v){ return Math.max(0, Math.min(10, v)); }
  function clear(){ app.innerHTML=''; window.scrollTo(0,0); }
  function visible(){ return [0,1,2,3].filter(function(i){return i!==S.p;}); }

  /* ---------- 타이틀 ---------- */
  function showTitle(){
    S=null; clear();
    var t=h('div','title');
    t.appendChild(h('span','room','단톡방 · 김이나정'));
    var hh=h('h1'); hh.innerHTML='우정 <em>파탄</em><br>시뮬레이터';
    t.appendChild(hh);
    t.appendChild(h('p','','금요일 밤, 오늘 이 우정은 무사할 수 있을까?'));
    app.appendChild(t);
    app.appendChild(h('div','pick-q','너는 누구야?'));
    var grid=h('div','picks');
    CH.forEach(function(c,i){
      var b=h('button','pick'); b.setAttribute('data-i',i);
      b.appendChild(h('span','em',c.e));
      b.appendChild(h('span','nm',c.n));
      b.appendChild(h('span','tg',c.tag));
      b.addEventListener('click',function(){ startGame(i); });
      grid.appendChild(b);
    });
    app.appendChild(grid);
    app.appendChild(h('div','how','나를 뺀 친구 세 명의 우정도는 모두 5에서 시작해. 선택으로 바뀌고, 마지막에 엔딩이 정해져.'));
  }

  /* ---------- 게임 시작 ---------- */
  function startGame(p){
    var seq=SCENES.filter(function(sc){return sc.main!==p;});
    S={p:p, g:[5,5,5,5], seq:seq, idx:0, flags:{d1:false,d3:false}};
    showScene();
  }

  function gaugeBox(){
    var box=h('div','gauges'); box.id='gauges';
    visible().forEach(function(i){
      var r=h('div','g-row'); r.id='g'+i;
      r.appendChild(h('span','nm',CH[i].e+' '+CH[i].s));
      r.appendChild(h('span','',''));
      var bar=h('div','bar'); var fill=h('i'); fill.style.background='var(--c'+i+')'; bar.appendChild(fill); r.appendChild(bar);
      r.appendChild(h('span','val',''));
      box.appendChild(r);
    });
    return box;
  }
  function paintGauges(dArr){
    visible().forEach(function(i){
      var r=document.getElementById('g'+i); if(!r) return;
      r.querySelector('.bar i').style.width=(S.g[i]*10)+'%';
      r.querySelector('.val').textContent=S.g[i];
      r.classList.toggle('low', S.g[i]<=1);
      r.classList.remove('flash-up','flash-down');
      if(dArr && dArr[i]>0) r.classList.add('flash-up');
      if(dArr && dArr[i]<0) r.classList.add('flash-down');
    });
  }

  function msg(w, text, delay){
    var m=h('div','msg reveal'); m.setAttribute('data-c',w);
    m.style.animationDelay=delay+'s';
    m.appendChild(h('div','avatar',CH[w].e));
    var box=h('div');
    box.appendChild(h('div','who',CH[w].n));
    box.appendChild(h('div','bubble',text));
    m.appendChild(box);
    return m;
  }

  /* ---------- 장면 ---------- */
  function showScene(){
    clear();
    var sc=S.seq[S.idx];
    app.appendChild(gaugeBox());
    paintGauges(null);

    var head=h('div','scene-head');
    head.appendChild(h('span','bg',sc.bg));
    var tt=h('div');
    tt.appendChild(h('h2','','장면 '+(S.idx+1)+'. '+sc.title));
    tt.appendChild(h('div','place',sc.place));
    head.appendChild(tt);
    var watching = sc.main===S.p;
    app.appendChild(head);

    var feed=h('div','feed'); app.appendChild(feed);
    var d=0;
    var n=h('div','narr reveal',sc.narr); n.style.animationDelay='0s'; feed.appendChild(n); d+=0.4;

    var after=h('div','after');
    var choicesBox=h('div','choices');

    sc.lines(S.p).forEach(function(l){ feed.appendChild(msg(l.w,l.t,d)); d+=0.5; });
    d+=0.2;

    var prog=h('div','progress');
    S.seq.forEach(function(_,i){ prog.appendChild(h('i', i<=S.idx?'on':'')); });

    choicesBox.className='choices reveal'; choicesBox.style.animationDelay=d+'s';
    sc.choices.forEach(function(c,ci){
      var txt = c.t;
      if(c.tp && S.p===3) txt=c.tp;
      var b=h('button','choice');
      b.appendChild(h('span','no',['①','②','③'][ci]));
      var tx=h('span','tx',txt);
      if(c.flag){ tx.appendChild(h('span','flag','독박 플래그')); }
      b.appendChild(tx);
      b.addEventListener('click',function(){ choose(sc,ci,b,choicesBox,feed,after); });
      choicesBox.appendChild(b);
    });

    app.appendChild(choicesBox);
    app.appendChild(after);
    app.appendChild(prog);
  }

  function choose(sc,ci,btn,box,feed,after){
    var c=sc.choices[ci];
    Array.prototype.forEach.call(box.children,function(b){ b.disabled=true; if(b!==btn) b.classList.add('dim'); });
    btn.classList.add('picked');
    if(c.flag) S.flags[c.flag]=true;

    // 반응 대사
    var r=c.r, text=r.t, sysText=null;
    if(sc.id===5){
      if(S.p===3 && ci===2){ r=c.rr; text=r.t; }
      else if(c.spk===S.p){ sysText=c.rp; }
    }
    if(sysText){
      var s=h('div','sys reveal',sysText); feed.appendChild(s);
    } else {
      feed.appendChild(msg(r.w,text,0));
    }

    // 점수 반영
    var dArr=c.d.slice();
    var chips=h('div','chips');
    visible().forEach(function(i){
      var v=dArr[i];
      S.g[i]=clamp(S.g[i]+v);
      var chip=h('span','chip '+(v>0?'up':v<0?'down':'zero'), CH[i].e+' '+CH[i].s+' '+(v>0?'+'+v:v));
      chips.appendChild(chip);
    });
    paintGauges(dArr);
    after.appendChild(chips);

    var last = S.idx===S.seq.length-1;
    var nx=h('button','btn reveal', last?'엔딩 보기 ▶':'다음 장면 ▶');
    nx.style.animationDelay='.5s';
    nx.addEventListener('click',function(){
      if(last){ showEnding(); } else { S.idx++; showScene(); }
    });
    after.appendChild(nx);
    nx.focus({preventScroll:true});
    after.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  /* ---------- 엔딩 판정 ---------- */
  function judge(){
    var f=visible(), g=S.g;
    var low=f.filter(function(i){return g[i]<=1;});
    if(low.length){
      low.sort(function(a,b){ return (g[a]-g[b]) || (a-b); });
      return {k:'cut', who:low[0]};
    }
    if(f.every(function(i){return g[i]>=6;})) return {k:'best'};
    var fav=null;
    f.forEach(function(i){
      if(g[i]>=8 && f.every(function(j){return j===i || g[j]<=5;})) fav=i;
    });
    if(fav!==null) return {k:'fav', who:fav};
    if((S.flags.d1 && g[1]>=6) || (S.flags.d3 && g[3]>=6)) return {k:'solo'};
    return {k:'meh'};
  }

  function endingData(j){
    var p=S.p, n=function(i){return CH[i].n;};
    var L=[];
    if(j.k==='cut'){
      var w=j.who;
      L.push({t:'sys',x:'"'+n(w)+'"님이 단톡방을 나갔습니다.'});
      if(w===0) L.push({t:'note',who:0,x:'5분 뒤, 프로필 상태메시지: "공주는 원래 먼저 연락 안 해."'});
      if(w===1) L.push({t:'note',who:1,x:'직후 인스타 스토리: "친구 사진 찍어줄 사람 구함 (경력자 우대)"'});
      if(w===2){ L.push({t:'sys',x:'새벽 3시, "'+n(2)+'"님이 입장하셨습니다.'}); L.push({t:'say',who:2,x:'나 어제 뭐 했어...?'}); }
      if(w===3){ L.push({t:'sys',x:'3분 뒤, "'+n(3)+'"님이 입장하셨습니다.'}); L.push({t:'say',who:3,x:'미안... 나가는 것도 거절 못 하겠어서 다시 들어왔어'}); }
      return {big:'💔', name:'손절 엔딩', sub:n(w)+' 손절', lines:L};
    }
    if(j.k==='best'){
      L.push({t:'narr',x:'12월 31일, 넷이 모였다.'});
      if(p!==1) L.push({t:'say',who:1,x:'단체 사진 한 장만! 세로로, 낮게!'});
      if(p!==2) L.push({t:'say',who:2,x:'오늘은 안 울 거야...'});
      if(p!==3) L.push({t:'say',who:3,x:'다 좋아~'});
      if(p!==0) L.push({t:'say',who:0,x:'공주 센터 ㅇㅋ?'});
      return {big:'🥂', name:'평생친구 엔딩', sub:'우정 만렙', lines:L};
    }
    if(j.k==='fav'){
      L.push({t:'sys',x:'단톡방 이름이 "'+n(j.who)+' 빼고"로 변경되었습니다.'});
      L.push({t:'narr',x:'나만 모르는 단톡방이 하나 더 생겼다.'});
      return {big:'🤫', name:'편애 엔딩', sub:'최애는 '+n(j.who), lines:L};
    }
    if(j.k==='solo'){
      var t='다음 날 아침, ';
      var parts=[];
      if(S.flags.d1 && S.g[1]>=6) parts.push('내 폰에는 사진 보정 요청 20장');
      if(S.flags.d3 && S.g[3]>=6) parts.push('내 등에는 이삿짐 박스');
      L.push({t:'narr',x:t+parts.join(', ')+'.'});
      L.push({t:'sys',x:'단톡방에는 한 줄: "고생했어~"'});
      return {big:'📦', name:'독박 엔딩', sub:'나만 고생', lines:L};
    }
    L.push({t:'narr',x:'연락은 하는데 모임은 계속 "다음에"로 밀린다.'});
    L.push({t:'sys',x:'단톡방 마지막 메시지는 3일째 "읽음 3"'});
    return {big:'😶', name:'애매한 사이 엔딩', sub:'읽씹도 아니고 답장도 아닌', lines:L};
  }

  function showEnding(){
    clear();
    var j=judge(), E=endingData(j);

    var card=h('div','end-card reveal');
    card.appendChild(h('div','big',E.big));
    card.appendChild(h('div','lab',CH[S.p].n+'의 우정 파탄 시뮬레이터'));
    card.appendChild(h('h2','',E.name));
    card.appendChild(h('div','lab',E.sub));
    app.appendChild(card);

    var feed=h('div','feed'); app.appendChild(feed);
    var d=0.3;
    E.lines.forEach(function(l){
      var e;
      if(l.t==='sys') e=h('div','sys reveal',l.x);
      else if(l.t==='narr') e=h('div','narr reveal',l.x);
      else if(l.t==='say') e=msg(l.who,l.x,d);
      else { e=h('div','note reveal'); e.appendChild(h('small','',CH[l.who].n)); e.appendChild(document.createTextNode(l.x)); }
      if(l.t!=='say') e.style.animationDelay=d+'s';
      d+=0.6;
      feed.appendChild(e);
    });

    var fg=h('div','final-g reveal'); fg.style.animationDelay=d+'s';
    fg.appendChild(h('h3','','최종 우정도'));
    visible().forEach(function(i){
      var r=h('div','g-row');
      r.appendChild(h('span','nm',CH[i].e+' '+CH[i].s));
      r.appendChild(h('span','',''));
      var bar=h('div','bar'); var fill=h('i'); fill.style.background='var(--c'+i+')'; fill.style.width=(S.g[i]*10)+'%'; bar.appendChild(fill); r.appendChild(bar);
      r.appendChild(h('span','val',S.g[i]));
      fg.appendChild(r);
    });
    app.appendChild(fg);

    var copyMsg=h('div','copied','');
    var copyBtn=h('button','btn ghost','결과 복사하기');
    var summary='우정 파탄 시뮬레이터 | '+CH[S.p].s+'로 플레이 → '+E.name+' ('+E.sub+')';
    copyBtn.addEventListener('click',function(){
      var done=function(){ copyMsg.textContent='복사했어! 단톡방에 붙여넣기 해봐.'; };
      var fail=function(){ copyMsg.textContent='복사가 안 돼서 아래 글을 직접 복사해줘: '+summary; };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(summary).then(done,fail);
        } else fail();
      }catch(e){ fail(); }
    });
    var again=h('button','btn','다시 하기');
    again.addEventListener('click',showTitle);
    var wrap=h('div','after');
    wrap.appendChild(again); wrap.appendChild(copyBtn); wrap.appendChild(copyMsg);
    app.appendChild(wrap);
  }

  showTitle();
})();
</script>

</body></html>
