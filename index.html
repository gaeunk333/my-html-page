<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가은이가 먹을 새우 까기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: 한 화면 게임. 위에 HUD(시간·점수·마릿수), 가운데 밝은 도마 같은 무대, 아래에 단계 썸네일. 무대는 사진의 흰 배경 때문에 두 테마 모두 밝게 유지. */
:root {
  --bg: #e9eff3;
  --fg: #17222b;
  --muted: #5a6975;
  --panel: #ffffff;
  --line: #cfd9e0;
  --accent: #e4491f;
  --accent-ink: #ffffff;
  --stage: #ffffff;
  --stage-ink: #17222b;
  --good: #1f8f5f;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171c; --fg: #e8eef3; --muted: #93a1ad; --panel: #19232b; --line: #2a3640;
    --accent: #ff6a3d; --accent-ink: #1a0d07; --good: #4fd09a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171c; --fg: #e8eef3; --muted: #93a1ad; --panel: #19232b; --line: #2a3640;
  --accent: #ff6a3d; --accent-ink: #1a0d07; --good: #4fd09a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.app { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; margin: 0; text-wrap: balance; }
.icon-btn {
  font: inherit; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 36px;
}
.icon-btn:hover { color: var(--fg); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat.low b { color: var(--accent); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transition: transform .1s linear; }

.stage-wrap { position: relative; }
.stage {
  display: block; width: 100%; aspect-ratio: 310 / 260; padding: 0; border: 0; border-radius: 16px;
  background: var(--stage); position: relative; overflow: hidden; cursor: pointer;
  box-shadow: 0 0 0 1px var(--line); user-select: none; -webkit-user-select: none;
}
.stage .shrimp {
  position: absolute; inset: 0; overflow: hidden;
  background-color: #b98a57;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='340'><filter id='g' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.006 0.22' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.30  0 0 0 0 0.17  0 0 0 0 0.07  0 0 0 1.6 -0.55'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>"),
    linear-gradient(180deg, #c99a62, #ad7d4a);
  background-size: 100% 100%, 100% 100%;
}
.plate {
  position: absolute; left: 3%; right: 3%; top: 5%; bottom: 7%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 45%, #f7f9fa 0 62%, #e3e9ed 78%, #f3f6f8 80%, #dfe5ea 100%);
  box-shadow: 0 10px 18px rgba(50,30,10,.38), 0 0 0 2px rgba(255,255,255,.55) inset, 0 2px 0 rgba(0,0,0,.12);
}
.stage img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  mix-blend-mode: multiply; opacity: 0; transition: opacity .12s; pointer-events: none; -webkit-user-drag: none;
}
.stage img.on { opacity: 1; }
.hint {
  position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 15px;
  color: #fff; background: rgba(35,22,12,.62); width: max-content; max-width: 90%; margin: 0 auto; padding: 3px 12px; border-radius: 999px; pointer-events: none;
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 16px; }
.bit { position: absolute; width: 12px; height: 7px; border-radius: 80% 10% 80% 10%; background: #f08a5d; will-change: transform, opacity; }
.pop { position: absolute; font-family: var(--font-display); font-size: 22px; color: var(--accent); text-shadow: 0 1px 0 #fff; will-change: transform, opacity; white-space: nowrap; }

.overlay {
  position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 20px; background: color-mix(in srgb, var(--panel) 90%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
.overlay p { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.overlay .big { font-family: var(--font-display); font-size: 52px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.btn {
  font-family: var(--font-display); font-size: 20px; color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 12px; padding: 12px 32px; min-height: 48px; cursor: pointer; margin-top: 6px;
}
.btn:active { transform: translateY(1px); }

.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.step { min-width: 0; text-align: center; font-size: 12px; color: var(--muted); }
.step .thumb {
  aspect-ratio: 310 / 260; border-radius: 8px; background: var(--stage); box-shadow: 0 0 0 1px var(--line);
  overflow: hidden; margin-bottom: 4px; opacity: .45; transition: opacity .15s, box-shadow .15s;
}
.step .thumb img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; display: block; }
.step.cur .thumb { opacity: 1; box-shadow: 0 0 0 3px var(--accent); }
.step.cur { color: var(--fg); }
.step.done .thumb { opacity: .8; }
.note { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

@keyframes drop { from { transform: translateY(-40px) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
.drop { animation: drop .28s ease-out; }
@media (prefers-reduced-motion: reduce) { .drop { animation: none; } .bar i { transition: none; } }
@media (max-width: 380px) { h1 { font-size: 21px; } .stat b { font-size: 22px; } .step { font-size: 11px; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>가은이가 먹을 새우 까기</h1>
    <button class="icon-btn" id="mute" type="button" aria-pressed="false">소리 켜짐</button>
  </header>

  <div class="hud" aria-live="off">
    <div class="stat" id="tstat"><span>남은 시간</span><b id="time">30</b></div>
    <div class="stat"><span>점수</span><b id="score">0</b></div>
    <div class="stat"><span>깐 새우</span><b id="count">0</b></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <div class="stage-wrap">
    <button class="stage" id="stage" type="button" aria-label="새우 누르기">
      <div class="shrimp" id="shrimp"><div class="plate"></div></div>
      <div class="hint" id="hint"></div>
      <div class="fx" id="fx"></div>
    </button>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">가은이가 먹을 새우를 까 주세요</h2>
      <p id="ov-text">새우를 톡톡 누르면 껍질이 한 단계씩 벗겨져요. 다 까면 시간이 2초 늘어납니다.</p>
      <div class="big" id="ov-big" hidden></div>
      <p id="ov-best" hidden></p>
      <button class="btn" id="go" type="button">시작</button>
    </div>
  </div>

  <div class="steps" id="steps"></div>
  <p class="note">스페이스바나 엔터 키로도 누를 수 있어요.</p>
</div>

}

// 소리
function blip(freq, dur, type, vol) {
  if (muted || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// 효과
function burst(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    const b = document.createElement('i'); b.className = 'bit';
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.background = ['#f08a5d', '#f6b08f', '#e4491f', '#fbd0b8'][i % 4];
    fx.appendChild(b);
    const a = Math.random() * Math.PI * 2, d = (spread || 70) * (0.5 + Math.random()), r = Math.random() * 360;
    b.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 40) + 'px) rotate(' + r + 'deg)', opacity: 0 }
    ], { duration: 550 + Math.random() * 250, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => b.remove();
  }
}
function pop(text, x, y) {
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = text;
  p.style.left = Math.max(8, x - 20) + 'px'; p.style.top = y - 14 + 'px'; fx.appendChild(p);
  p.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-44px)', opacity: 0 }], { duration: 750, easing: 'ease-out' }).onfinish = () => p.remove();
}
function shake(strong) {
  const a = strong ? 7 : 4;
  shrimp.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + -a + 'px) rotate(-1deg)' }, { transform: 'translateX(' + a + 'px) rotate(1deg)' }, { transform: 'translateX(0)' }], { duration: 160 });
}

function tap(x, y) {
  if (!running || locked) return;
  taps++; score += 10;
  burst(x, y, step === 0 ? 5 : 8, 60);
  pop('+10', x, y);
  if (taps < NEED[step]) { shake(false); blip(380 + taps * 60, .08); hud(); return; }
  // 다음 단계로
  shake(true); burst(x, y, 12, 90);
  if (step < 3) { blip(300, .14, 'square', .08); show(step + 1); hud(); return; }
  // 완성
  show(4); count++;
  const secs = (performance.now() - shrimpStart) / 1000;
  const speed = Math.max(0, Math.round((4 - secs) * 15));   // 4초 안에 끝내면 보너스
  const gain = 50 + speed; score += gain; timeLeft += BONUS_TIME;
  pop(speed > 0 ? '완성 +' + gain + ' (빠름)' : '완성 +' + gain, stage.clientWidth * 0.3, stage.clientHeight * 0.45);
  blip(620, .25, 'sine', .15); setTimeout(() => blip(880, .25, 'sine', .12), 90);
  hud(); locked = true;
  setTimeout(() => {
    locked = false; if (!running) return;
    show(0); shrimpStart = performance.now();
    shrimp.classList.remove('drop'); void shrimp.offsetWidth; shrimp.classList.add('drop');
  }, 520);
}

stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(); tap(e.clientX - r.left, e.clientY - r.top);
});
stage.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) tap(stage.clientWidth * 0.45, stage.clientHeight * 0.4); }
});
stage.addEventListener('click', e => e.preventDefault());

function loop() {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  timeLeft -= dt; hud();
  if (timeLeft <= 0) end();
}
function start() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  running = true; locked = false; timeLeft = START_TIME; score = 0; count = 0;
  overlay.hidden = true; show(0); hud(); shrimpStart = performance.now();
  shrimp.classList.remove('drop'); void shrimp.offsetWidth; shrimp.classList.add('drop');
  last = performance.now(); clearInterval(timer); timer = setInterval(loop, 100);
  stage.focus({ preventScroll: true });
}
function end() {
  running = false; clearInterval(timer); timeLeft = 0; hud(); show(step);
  const isBest = score > best && score > 0;
  if (isBest) { best = score; try { localStorage.setItem('shrimp-best', String(best)); } catch (e) {} }
  $('ov-title').textContent = '시간 종료'; $('ov-text').textContent = count > 0 ? '가은이가 먹을 새우 ' + count + '마리를 까줬어요.' : '가은이가 배고프대요. 다시 도전해 보세요!';
  $('ov-big').hidden = false; $('ov-big').textContent = score + '점';
  $('ov-best').hidden = false; $('ov-best').textContent = isBest ? '가은이가 먹을 새우를 가장 많이 깐 당신은 최고의 친구!' : '최고 기록 ' + best + '점';
  $('go').textContent = '다시 하기'; overlay.hidden = false; blip(220, .4, 'sawtooth', .08);
  $('go').focus({ preventScroll: true });
}
$('go').addEventListener('click', start);
$('mute').addEventListener('click', () => {
  muted = !muted; $('mute').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; $('mute').setAttribute('aria-pressed', String(muted));
});
show(0); hud();
if (best) { $('ov-best').hidden = false; $('ov-best').textContent = '최고 기록 ' + best + '점'; }
</script>
</body>
</html>
